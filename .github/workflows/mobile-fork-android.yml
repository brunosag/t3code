name: Build fork Android app

# Fork-only pipeline: push bsag -> build the fork's signed release APK
# (com.bsag.t3code) and publish it as a prerelease on this fork. Install it by
# hand or with a GitHub-release tracker such as Obtainium.
on:
  push:
    branches:
      - bsag
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/mobile-fork-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-fork-android
  cancel-in-progress: true

jobs:
  build:
    name: Build, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Mobile typecheck and tests
        working-directory: apps/mobile
        run: |
          vp run typecheck
          vp test run app.config.test.ts src/features/agent-awareness

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing and Firebase files
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.FORK_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          echo "T3CODE_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "T3CODE_ANDROID_GOOGLE_SERVICES_FILE=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: gradle-

      - name: Build release APK
        working-directory: apps/mobile
        env:
          T3CODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
          T3CODE_ANDROID_KEY_PASSWORD: ${{ secrets.FORK_ANDROID_KEYSTORE_PASSWORD }}
          T3CODE_ANDROID_KEY_ALIAS: t3code-fork
        run: |
          set -euo pipefail
          vp exec expo prebuild --clean --platform android
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/release/t3code-fork-${GITHUB_SHA::9}.apk"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-$(date -u +%Y%m%d).${{ github.run_number }}"
          gh release create "$tag" release/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fork Android $tag (${GITHUB_SHA::9})" \
            --prerelease --latest=false \
            --notes "Fork Android build of ${GITHUB_SHA}."

      # Keep the five most recent builds.
      - name: Prune old builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^android-[0-9]{8}\\.[0-9]+$"))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            > stale-tags.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < stale-tags.txt
